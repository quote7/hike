<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>OpenTrails</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.3.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="status-bar" class="status-bar" hidden>
  <div id="gps" class="chip" role="status" hidden>GPS off</div>
  <div id="weather" class="chip weather-chip" role="status">
    <span id="weather-icon" class="i" data-glyph="cloud" aria-hidden="true"></span>
    <span id="weather-text">Waiting for GPS</span>
  </div>
</div>
<div id="toast" role="status" hidden></div>
<input id="gpx-file" type="file" hidden>
<main id="main-menu" class="menu-screen">
  <div class="menu-content">
    <h1>OpenTrails</h1>
    <div class="menu-options">
      <button id="view-map" class="btn menu-btn"><span class="i" data-glyph="map" aria-hidden="true"></span>View Map</button>
      <button id="import" class="btn menu-btn"><span class="i" data-glyph="download" aria-hidden="true"></span>Import Trail</button>
      <button id="blank-hike" class="btn pri menu-btn"><span class="i" data-glyph="play" aria-hidden="true"></span>Record Hike</button>
      <button id="saved-open" class="btn menu-btn"><span class="i" data-glyph="list" aria-hidden="true"></span>Saved hikes</button>
      <button id="settings-open" class="btn menu-btn"><span class="i" data-glyph="settings" aria-hidden="true"></span>Settings</button>
    </div>
  </div>
</main>
<section id="saved-screen" class="menu-screen" hidden>
  <div class="menu-content">
    <h1>Saved hikes</h1>
    <ul id="items"></ul>
    <button id="saved-back" class="btn menu-btn"><span class="i" data-glyph="chevron-left" aria-hidden="true"></span>Main menu</button>
  </div>
</section>
<section id="settings-screen" class="menu-screen" hidden>
  <div class="menu-content">
    <h1>Settings</h1>
    <fieldset>
      <legend>Appearance</legend>
      <div class="segments"><button id="theme-light" class="segment" aria-pressed="false">Light</button><button id="theme-dark" class="segment" aria-pressed="false">Dark</button></div>
    </fieldset>
    <fieldset>
      <legend>Distance units</legend>
      <div id="unit-options" class="segments"><button id="units-metric" class="segment" aria-pressed="false">km</button><button id="units-imperial" class="segment" aria-pressed="false">mi</button><button id="units-nautical" class="segment" aria-pressed="false">nmi</button></div>
    </fieldset>
    <fieldset>
      <legend>Map</legend>
      <div class="segments"><button id="mapbox-layer" class="segment" aria-pressed="false">Mapbox</button><button id="osm-layer" class="segment" aria-pressed="false">OpenStreetMap</button></div>
    </fieldset>
    <fieldset>
      <legend>Weather overlay</legend>
      <div class="segments"><button id="weather-off" class="segment" aria-pressed="false">Off</button><button id="weather-on" class="segment" aria-pressed="false">On</button></div>
    </fieldset>
    <button id="settings-back" class="btn menu-btn"><span class="i" data-glyph="chevron-left" aria-hidden="true"></span>Back</button>
  </div>
</section>
<main id="map" aria-label="Map" hidden></main>

<section id="sheet" hidden>
  <button id="grab" aria-controls="views" aria-expanded="true" aria-label="Collapse panel"></button>
  <div id="mini" aria-hidden="true"></div>
  <div class="fabs">
    <button id="loc" class="fab on" aria-label="Center on me and follow" aria-pressed="true"><span class="i" data-glyph="locate-fixed" aria-hidden="true"></span></button>
  </div>
  <div id="views">
    <div id="v-idle" class="view">
      <h2>Map</h2>
      <button id="main-menu-back" class="btn map-back"><span class="i" data-glyph="chevron-left" aria-hidden="true"></span>Main menu</button>
    </div>
    <div id="v-gpx" class="view" hidden>
      <h2 id="route-name"></h2>
      <div class="grid">
        <div><small>Route distance</small><b id="route-distance"></b></div>
        <div><small>Max elevation gain</small><b id="route-elevation-gain"></b></div>
      </div>
      <div class="row"><button id="start-trail" class="btn pri"><span class="i" data-glyph="play" aria-hidden="true"></span>Start hike</button></div>
      <div class="route-actions">
        <button id="save-route" class="btn"><span class="i" data-glyph="bookmark" aria-hidden="true"></span>Save for later</button>
        <button id="route-menu-back" class="btn map-back"><span class="i" data-glyph="chevron-left" aria-hidden="true"></span>Main menu</button>
      </div>
    </div>
    <div id="v-rec" class="view" hidden>
      <div id="stats" class="grid"></div>
      <div class="row">
        <button id="pause" class="btn"><span id="pi" class="i" data-glyph="pause" aria-hidden="true"></span><span id="pt">Pause</span></button>
        <button id="stop" class="btn stop"><span class="i" data-glyph="square" aria-hidden="true"></span>Stop</button>
      </div>
    </div>
    <div id="v-det" class="view" hidden></div>
  </div>
</section>

<dialog id="dlg">
  <form method="dialog">
    <h2></h2><p></p>
    <div class="row"><button class="btn" value="no">Cancel</button><button class="btn pri" value="ok">OK</button></div>
  </form>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.3.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
