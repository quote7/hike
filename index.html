<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Switchback</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-loc" viewBox="0 0 24 24"><path d="M3 11 21 3l-8 18-2-8-8-2Z"/></symbol>
<symbol id="i-import" viewBox="0 0 24 24"><path d="M12 15V3m0 12 4-4m-4 4-4-4"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M7.5 4.6v14.8a1 1 0 0 0 1.5.9l11.7-7.4a1 1 0 0 0 0-1.7L9 3.7a1 1 0 0 0-1.5.9Z"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1.3" fill="currentColor" stroke="none"/><rect x="14" y="4.5" width="4" height="15" rx="1.3" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="5.5" y="5.5" width="13" height="13" rx="3" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><g fill="currentColor" stroke="none"><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></g></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3.5M8 7l4-4 4 4"/><path d="M8 10H6.5A1.5 1.5 0 0 0 5 11.5v8A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-8a1.5 1.5 0 0 0-1.5-1.5H16"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 11v6M14.5 11v6M6 7l.8 11.2A2 2 0 0 0 8.8 20h6.4a2 2 0 0 0 2-1.8L18 7M9 7V4.5h6V7"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
</defs></svg>

<div id="gps" class="chip" role="status" hidden>GPS off</div>
<div id="toast" role="status" hidden></div>
<input id="gpx-file" type="file" hidden>
<main id="main-menu" class="menu-screen">
  <div class="menu-content">
    <h1>Switchback</h1>
    <div class="menu-options">
      <button id="view-map" class="btn menu-btn">View Map</button>
      <button id="import" class="btn menu-btn"><svg class="i"><use href="#i-import"/></svg>Import Trail</button>
      <button id="blank-hike" class="btn pri menu-btn"><svg class="i"><use href="#i-play"/></svg>Start Blank Hike</button>
      <button id="settings-open" class="btn menu-btn">Settings</button>
    </div>
  </div>
</main>
<section id="settings-screen" class="menu-screen" hidden>
  <div class="menu-content">
    <h1>Settings</h1>
    <fieldset>
      <legend>Appearance</legend>
      <div class="segments"><button id="theme-light" class="segment" aria-pressed="false">Light</button><button id="theme-dark" class="segment" aria-pressed="false">Dark</button></div>
    </fieldset>
    <fieldset>
      <legend>Map</legend>
      <div class="segments"><button id="mapbox-layer" class="segment" aria-pressed="false">Mapbox</button><button id="osm-layer" class="segment" aria-pressed="false">OpenStreetMap</button></div>
    </fieldset>
    <button id="settings-back" class="btn menu-btn"><svg class="i"><use href="#i-back"/></svg>Back</button>
  </div>
</section>
<main id="map" aria-label="Map" hidden></main>

<section id="sheet" hidden>
  <button id="grab" aria-controls="views" aria-expanded="true" aria-label="Collapse panel"></button>
  <div id="mini" aria-hidden="true"></div>
  <div class="fabs">
    <button id="loc" class="fab on" aria-label="Center on me and follow" aria-pressed="true"><svg class="i"><use href="#i-loc"/></svg></button>
  </div>
  <div id="views">
    <div id="v-idle" class="view">
      <button id="main-menu-back" class="btn map-back"><svg class="i"><use href="#i-back"/></svg>Main menu</button>
      <h2>Map</h2>
      <div class="tiles">
        <button id="saved" class="tile"><svg class="i"><use href="#i-list"/></svg><span>Saved</span></button>
        <button id="units" class="tile" aria-label="Switch between metric and imperial units"><b id="ut">km</b><span>Units</span></button>
      </div>
    </div>
    <div id="v-gpx" class="view" hidden>
      <h2 id="route-name"></h2>
      <div class="grid">
        <div><small>Route distance</small><b id="route-distance"></b></div>
        <div><small>Mode</small><b id="route-mode">Overview</b></div>
      </div>
      <div class="row"><button id="overview" class="btn">Overview</button><button id="start-trail" class="btn pri"><svg class="i"><use href="#i-play"/></svg>Start hike</button></div>
      <button id="clear-route" class="btn danger clear-route">Clear route</button>
      <button id="route-menu-back" class="btn map-back"><svg class="i"><use href="#i-back"/></svg>Main menu</button>
    </div>
    <div id="v-rec" class="view" hidden>
      <div id="stats" class="grid"></div>
      <div class="row">
        <button id="pause" class="btn"><svg class="i"><use id="pi" href="#i-pause"/></svg><span id="pt">Pause</span></button>
        <button id="stop" class="btn stop"><svg class="i"><use href="#i-stop"/></svg>Stop</button>
      </div>
    </div>
    <div id="v-list" class="view" hidden>
      <h2>Saved hikes</h2>
      <ul id="items"></ul>
      <button id="lback" class="btn"><svg class="i"><use href="#i-back"/></svg>Back</button>
    </div>
    <div id="v-det" class="view" hidden></div>
  </div>
</section>

<dialog id="dlg">
  <form method="dialog">
    <h2></h2><p></p>
    <div class="row"><button class="btn" value="no">Cancel</button><button class="btn pri" value="ok">OK</button></div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
